
services:
  backend:
    restart: always
    container_name: motor-control-hub-backend
    build:
      context: ./backend
    expose:
      - "8080"
    networks:
      - default
    
  frontend:
    restart: always
    depends_on:
      - backend
    build:
      context: ./frontend
    ports:
      - "80:80"
    networks:
      - default
    

networks:
  default:
    name: motor-control-hub-net